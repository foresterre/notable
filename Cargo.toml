[workspace]
resolver = "3"
members = [
    "crates/notable",
    "crates/notable-core",
]

[workspace.package]
version = "0.1.0"
authors = ["Martijn Gribnau <garm@ilumeo.com>"]
description = "Parser, linter and merge conflict solver for keep-a-changelog like Changelog's"
license = "Apache-2.0 OR MIT"
edition = "2024"
repository = "https://github.com/foresterre/notable"

[workspace.dependencies]
jiff = { version = "0.2.43", default-features = false, features = ["std"] }
thiserror = "2.0.21"
yare = "3.0.0"
