name: "ci-changelog"
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
permissions:
  contents: read

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - name: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install_rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: lint_library_changelog
        run: cargo run --locked -p notable-cli -- lint CHANGELOG.md

      - name: lint_cli_changelog
        if: ${{ !cancelled() }}
        run: cargo run --locked -p notable-cli -- lint crates/notable-cli/CHANGELOG.md
